<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sadece zeybikkk için 💜</title>

<style>
body{
    margin:0;
    height:100vh;
    background:radial-gradient(circle at center,#1a001f,#000000 70%);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:'Segoe UI',sans-serif;
    overflow:hidden;
    color:white;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    backdrop-filter:blur(8px);
    background:rgba(0,0,0,0.6);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:28px;
    text-align:center;
    z-index:10;
    transition:1.5s;
}

.overlay button{
    margin-top:25px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:#b46cff;
    color:white;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 0 15px #b46cff;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

.container{
    text-align:center;
    opacity:0;
    transition:2s;
}

.container.showPage{
    opacity:1;
}

.flower-wrapper{
    width:250px;
    height:250px;
    margin:auto;
    transform:scale(0.5);
    opacity:0;
    transition:1.5s ease;
}

.flower-wrapper.showFlower{
    transform:scale(1);
    opacity:1;
    animation:pulse 2s infinite alternate;
}

@keyframes pulse{
    from{filter:drop-shadow(0 0 10px #8f3fff);}
    to{filter:drop-shadow(0 0 25px #d59cff);}
}

.flower-svg ellipse{
    fill:#b46cff;
    transform-origin:100px 100px;
    transform:scale(0);
    transition:1s ease;
}

.core{
    fill:#ffffff;
    opacity:0;
    filter:drop-shadow(0 0 20px #ffffff);
    transition:1s ease;
}

.note{
    opacity:0;
    margin-top:20px;
    transition:1.5s;
}

textarea{
    width:300px;
    height:110px;
    border-radius:20px;
    border:none;
    padding:15px;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:15px;
    resize:none;
    backdrop-filter:blur(10px);
}

.visible{
    opacity:1;
}

.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:#d59cff;
    border-radius:50%;
    animation:floatUp 5s linear infinite;
    opacity:0.8;
}

@keyframes floatUp{
    0%{transform:translateY(0);opacity:0.8;}
    100%{transform:translateY(-800px);opacity:0;}
}
</style>
</head>

<body>

<div class="overlay" id="overlay">
    Sadece zeybikkk için… 💜<br>
    <button onclick="startExperience()">Hazır mısın? ✨</button>
</div>

<div class="container" id="mainPage">

<div class="flower-wrapper">
<svg viewBox="0 0 200 200" class="flower-svg">
  <circle cx="100" cy="100" r="20" class="core"/>
  <g>
    <ellipse cx="100" cy="55" rx="18" ry="40"/>
    <ellipse cx="145" cy="100" rx="18" ry="40" transform="rotate(90 145 100)"/>
    <ellipse cx="100" cy="145" rx="18" ry="40"/>
    <ellipse cx="55" cy="100" rx="18" ry="40" transform="rotate(90 55 100)"/>
    <ellipse cx="135" cy="65" rx="18" ry="40" transform="rotate(45 135 65)"/>
    <ellipse cx="65" cy="65" rx="18" ry="40" transform="rotate(-45 65 65)"/>
  </g>
</svg>
</div>

<div class="note">
<textarea>
Belki seni biraz üzdüm...
Ama kalbimdeki yerin hep aynı.
Beni affeder misin? 💜
</textarea>
</div>

</div>

<audio id="music" src="hanimefendi.mp3"></audio>

<script>
function startExperience(){
    const music = document.getElementById("music");
    music.play().then(()=>{
        music.volume = 0;
        fadeInMusic(music,3000);
    });

    document.getElementById("overlay").classList.add("hidden");
    const page = document.getElementById("mainPage");
    page.classList.add("showPage");

    setTimeout(openFlower,800);
}

function openFlower(){
    const wrapper = document.querySelector(".flower-wrapper");
    const petals = document.querySelectorAll("ellipse");
    const core = document.querySelector(".core");
    const note = document.querySelector(".note");

    wrapper.classList.add("showFlower");

    petals.forEach((p,i)=>{
        setTimeout(()=>{
            p.style.transform="scale(1)";
        },i*200);
    });

    setTimeout(()=>{
        core.style.opacity="1";
    },1200);

    setTimeout(()=>{
        note.classList.add("visible");
    },2000);

    createParticles();
}

function fadeInMusic(audio,duration){
    let steps=30;
    let stepTime=duration/steps;
    let volumeStep=1/steps;
    let currentStep=0;

    let fade=setInterval(function(){
        currentStep++;
        audio.volume=Math.min(volumeStep*currentStep,1);
        if(currentStep>=steps){
            clearInterval(fade);
        }
    },stepTime);
}

function createParticles(){
    setInterval(()=>{
        const p=document.createElement("div");
        p.classList.add("particle");
        p.style.left=Math.random()*100+"vw";
        p.style.top="100vh";
        document.body.appendChild(p);
        setTimeout(()=>{p.remove()},5000);
    },300);
}
</script>

</body>
</html>
